services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: incli
      POSTGRES_USER: incli
      POSTGRES_PASSWORD: incli
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incli -d incli"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://incli:incli@postgres:5432/incli
      PORT: "3000"
      HOST: 0.0.0.0
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
